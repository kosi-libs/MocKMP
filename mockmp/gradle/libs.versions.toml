[versions]
android-gradle-plugin = "9.1.1"     # https://developer.android.com/build/releases/about-agp
buildConfig = "6.0.10"              # https://github.com/gmazzo/gradle-buildconfig-plugin/releases
coroutines = "1.11.0"               # https://github.com/Kotlin/kotlinx.coroutines/releases
datetime = "0.8.0"                  # https://github.com/Kotlin/kotlinx-datetime/releases
gradle-pluginPublish = "2.1.1"      # https://plugins.gradle.org/plugin/com.gradle.plugin-publish
kctfork = "0.13.0"                  # https://github.com/ZacSweers/kotlin-compile-testing/releases
kotlin = "2.3.21"                   # https://kotlinlang.org/docs/releases.html#release-history
kotlinPoet = "2.3.0"                # https://github.com/square/kotlinpoet/releases
ksp = "2.3.10"                      # https://github.com/google/ksp/releases
mavenPublish = "0.37.0"             # https://github.com/vanniktech/gradle-maven-publish-plugin/releases

[plugins]
android-library = { id = "com.android.library", version.ref = "android-gradle-plugin" }
android-multiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "android-gradle-plugin" }
buildConfig = { id = "com.github.gmazzo.buildconfig", version.ref = "buildConfig" }
gradle-pluginPublish = { id = "com.gradle.plugin-publish", version.ref = "gradle-pluginPublish" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-plugin-samWithReceiver = { id = "org.jetbrains.kotlin.plugin.sam.with.receiver", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }

[libraries]
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "android-gradle-plugin" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlinPoet-ksp = { module = "com.squareup:kotlinpoet-ksp", version.ref = "kotlinPoet" }
kctfork-ksp = { module = "dev.zacsweers.kctfork:ksp", version.ref = "kctfork" }
ksp-gradlePlugin = { module = "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
ksp-symbolProcessingApi = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }
