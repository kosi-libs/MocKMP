name: check

# Three triggers, deliberately:
#  - pull_request validates a change before it lands;
#  - push to main validates the merge result, which no PR run can (a PR is tested against its own
#    head, so two individually-green PRs can still break main together);
#  - workflow_dispatch re-runs the suite on demand, for when something outside the repo moves — a new
#    Xcode or Node on the runner image, or a dependency republished under the same version.
#
# The ignore list covers documentation only. .github/** is deliberately absent from it: a change to
# this workflow should run this workflow.
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '**.adoc'
      - '**/.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - '**.adoc'
      - '**/.gitignore'
  workflow_dispatch:

jobs:

  check:
    # macOS is the only image that can build the Apple targets, so it runs the whole suite. The
    # consequence, accepted deliberately: linuxX64Test and mingwX64Test are cross-compiled but never
    # executed anywhere — KGP disables them off their host ("w: Native task 'linuxX64Test' is
    # disabled"), and build/test-results/ has no directory for either. Every other target is covered:
    # :tests-projects:check builds mockmp transitively for all of them, and mockmp-runtime declares
    # the same target set as tests-mp-junit4. Running those two would take a runner matrix.
    runs-on: macOS-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up JDK Temurin 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Cached Konan
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-konan-
      # Before the multiplatform check, not after: these are in-process compilations that finish in
      # seconds, so a broken processor diagnostic fails the run immediately rather than behind a full
      # Apple/JS/Native build. :tests-projects:check does not reach them — it builds the processor, but
      # runs no test of its own.
      - name: Test the processor
        run: ./gradlew --stacktrace --scan :mockmp:mockmp-processor:test
        shell: bash
      - name: Check
        run: ./gradlew --stacktrace --scan :tests-projects:check
        shell: bash
