name: build and publish a release

on:
  release:
    types: [published]

jobs:
  build-upload:
    runs-on: macOS-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up JDK Temurin 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Cached Konan
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-konan-
      - name: Check
        run: ./gradlew --stacktrace --scan :tests-projects:check
        shell: bash
      - name: Upload to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_PORTAL_TOKEN_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PORTAL_TOKEN_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.PGP_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.PGP_SIGNING_PASSWORD }}
        run: ./gradlew --stacktrace --scan -PRELEASE_SIGNING_ENABLED=true mockmp:publishAndReleaseToMavenCentral
        shell: bash
      - name: Publish to Gradle Portal
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew --stacktrace --scan -PRELEASE_SIGNING_ENABLED=true mockmp:publishPlugins
        shell: bash
